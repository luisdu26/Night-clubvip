<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin VIP - NIGHT CLUB VIP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050008;
color:white;
min-height:100vh;
}

h1{
text-align:center;
padding:40px 20px 10px;
font-size:40px;
color:#ff00ff;
text-shadow:0 0 10px #ff00ff, 0 0 40px #00ffff;
}

/* LOGIN */

#login{
max-width:400px;
margin:80px auto;
padding:40px;
background:#120018;
border-radius:20px;
box-shadow:0 0 20px #ff00ff;
text-align:center;
}

#login input{
width:100%;
padding:15px 20px;
margin:20px 0;
border-radius:30px;
border:2px solid #ff00ff;
background:#050008;
color:white;
font-size:16px;
}

#login input:focus{
outline:none;
border-color:#00ffff;
}

#login button{
padding:15px 40px;
background:#ff00ff;
border:none;
border-radius:30px;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 20px #ff00ff;
}

#loginError{
color:#ff5555;
margin-top:15px;
min-height:20px;
}

/* PANEL */

#panel{
display:none;
max-width:900px;
margin:0 auto;
padding:20px 20px 60px;
}

.vip-card{
background:#120018;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 20px #00ffff;
display:flex;
flex-wrap:wrap;
justify-content:space-between;
align-items:center;
gap:15px;
}

.vip-info h3{
color:#ff00ff;
margin-bottom:8px;
}

.vip-info p{
opacity:.85;
font-size:14px;
}

.statut{
font-weight:bold;
padding:6px 16px;
border-radius:20px;
font-size:13px;
text-transform:uppercase;
}

.statut.en_attente{ background:#443300; color:#ffd700; }
.statut.accepte{ background:#003a1a; color:#00ff88; }
.statut.refuse{ background:#4a0010; color:#ff5577; }

.vip-actions button{
padding:10px 20px;
border:none;
border-radius:20px;
color:white;
font-size:14px;
cursor:pointer;
margin-left:10px;
}

.btn-accept{ background:#00aa55; }
.btn-refuse{ background:#aa2244; }
.btn-cancel{ background:#663300; }
.btn-minus{ background:#333; }

.type-badge{
display:inline-block;
padding:4px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
text-transform:uppercase;
margin-right:10px;
}

.type-badge.normal{ background:#222; color:#aaa; }
.type-badge.vip{ background:#3a0033; color:#ff66ff; }

.changements{
font-size:14px;
opacity:.85;
margin-top:6px;
}

#empty{
text-align:center;
opacity:.6;
padding:60px 20px;
}

</style>
</head>

<body>

<h1>Admin Réservations</h1>

<div id="login">
<p>Entre le mot de passe pour voir les réservations.</p>
<input type="password" id="pwdInput" placeholder="Mot de passe">
<br>
<button onclick="checkPassword()">Entrer</button>
<p id="loginError"></p>
</div>

<div id="panel">
<div id="list"></div>
<p id="empty" style="display:none;">Aucune réservation pour le moment.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

const SUPABASE_URL = "https://zljtlfhqrvqzhyxaeoru.supabase.co";
const SUPABASE_KEY = "sb_publishable_ScZ3GJ8XKa7luKwx8RwD8g_hjAn9Zwp";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const EMAILJS_SERVICE_ID = "service_tmjvct3";
const EMAILJS_TEMPLATE_ID = "template_lcateej";
const EMAILJS_PUBLIC_KEY = "gem9kvt6rLbeREk8j";

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

function envoyerEmail(contact, nom, message){
  if(!contact){ alert("Pas d'email pour cette personne."); return; }
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    to_email: contact,
    to_name: nom,
    message: message
  }).then(() => {
    alert("Email envoyé à " + contact);
  }).catch((err) => {
    alert("Erreur email : " + JSON.stringify(err));
    console.error('Erreur email:', err);
  });
}

// Écris ton mot de passe ici, ENTRE LES GUILLEMETS (ex: "Luisdu26").
const ADMIN_PASSWORD = "Luisdu26";

function checkPassword(){
  const input = document.getElementById('pwdInput').value;
  const err = document.getElementById('loginError');

  if(input === ADMIN_PASSWORD){
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadList();
  } else {
    err.textContent = "Mot de passe incorrect.";
  }
}

document.getElementById('pwdInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') checkPassword();
});

function statutLabel(s){
  if(s === 'accepte') return 'VIP accepté';
  if(s === 'refuse') return 'VIP refusé';
  if(s === 'annule') return 'VIP annulé';
  if(s === 'validee') return 'Confirmée';
  return 'En attente de validation';
}

async function loadList(){
  const { data, error } = await client.from('vip_signus').select('*').order('created_at', { ascending: false });

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';

  if(error){
    console.error(error);
    return;
  }

  if(!data || data.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  data.forEach((d) => {
    const statut = d.statut || 'en_attente';
    const date = d.created_at ? new Date(d.created_at).toLocaleString('fr-FR') : '';

    const card = document.createElement('div');
    card.className = 'vip-card';

    const info = document.createElement('div');
    info.className = 'vip-info';

    const badge = document.createElement('span');
    badge.className = `type-badge ${d.type || 'normal'}`;
    badge.textContent = d.type === 'vip' ? 'VIP' : 'Normal';

    const h3 = document.createElement('h3');
    h3.textContent = d.nom || '';

    const p = document.createElement('p');
    p.textContent = date;

    const span = document.createElement('span');
    span.className = `statut ${statut}`;
    span.textContent = statutLabel(statut);

    info.appendChild(badge);
    info.appendChild(h3);
    info.appendChild(p);
    info.appendChild(span);

    if(d.type === 'vip' && statut === 'accepte'){
      const changements = document.createElement('p');
      changements.className = 'changements';
      changements.textContent = `Changements de musique restants : ${d.changements}`;
      info.appendChild(changements);
    }

    const actions = document.createElement('div');
    actions.className = 'vip-actions';

    if(d.type === 'vip' && statut === 'en_attente'){
      const btnAccept = document.createElement('button');
      btnAccept.className = 'btn-accept';
      btnAccept.textContent = 'Accepter';
      btnAccept.onclick = () => updateStatut(d.id, 'accepte', d.contact, d.nom);

      const btnRefuse = document.createElement('button');
      btnRefuse.className = 'btn-refuse';
      btnRefuse.textContent = 'Refuser';
      btnRefuse.onclick = () => updateStatut(d.id, 'refuse', d.contact, d.nom);

      actions.appendChild(btnAccept);
      actions.appendChild(btnRefuse);
    }

    if(d.type === 'vip' && statut === 'accepte'){
      const btnMinus = document.createElement('button');
      btnMinus.className = 'btn-minus';
      btnMinus.textContent = '-1 changement';
      btnMinus.onclick = () => decrementChangement(d.id, d.changements);

      const btnCancel = document.createElement('button');
      btnCancel.className = 'btn-cancel';
      btnCancel.textContent = 'Annuler le VIP';
      btnCancel.onclick = () => updateStatut(d.id, 'annule', d.contact, d.nom);

      actions.appendChild(btnMinus);
      actions.appendChild(btnCancel);
    }

    card.appendChild(info);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

async function updateStatut(id, statut, contact, nom){
  await client.from('vip_signus').update({ statut: statut }).eq('id', id);

  let message = '';
  if(statut === 'accepte'){ message = 'Bonne nouvelle : ta demande de table VIP a été acceptée ! 5 Boissons offertes, 3 changements de musique inclus est un service client est karaokey.'; }
  if(statut === 'refuse'){ message = "Ta demande de table VIP a malheureusement été refusée."; }
  if(statut === 'annule'){ message = "Ton statut VIP a été annulé."; }

  if(message){ envoyerEmail(contact, nom, message); }

  loadList();
}

async function decrementChangement(id, current){
  const next = current > 0 ? current - 1 : 0;
  await client.from('vip_signus').update({ changements: next }).eq('id', id);
  loadList();
}

</script>

</body>

</html>
